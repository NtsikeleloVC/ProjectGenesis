<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
</head>

<body>

    <h1>AI Text Summarizer</h1>

    <p>Enter your text here and click the summarize button to generate a summary.</p>

    <textarea id="textInput" rows="15" cols="60" placeholder="Paste your text here..."></textarea>
    
    <br><br>
    
    <button id="summarizeButton">Summarize</button>

    <h2>Summary:</h2>
    <div id="summaryOutput">Your summary will appear here.</div> 

    <script src="script.js"></script>

</body>
</html>
